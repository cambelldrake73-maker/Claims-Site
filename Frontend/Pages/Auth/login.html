<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
* { box-sizing: border-box; }
body{
font-family: Arial, Helvetica, sans-serif;
background:#f4f6fb;
margin:0;
min-height:100vh;
padding:20px;
}

.page-top{
max-width:980px;
margin:0 auto 16px;
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
}

.brand-link{
text-decoration:none;
color:#0f172a;
font-weight:700;
font-size:20px;
}

.top-links a{
text-decoration:none;
color:#2563eb;
font-weight:600;
margin-left:12px;
}

.shell{
max-width:980px;
margin:0 auto;
min-height:calc(100vh - 90px);
display:flex;
justify-content:center;
align-items:center;
}

.login-box{
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
width:350px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{ background:#1d4ed8; }

.form-link{
display:block;
margin-top:15px;
text-decoration:none;
color:#2563eb;
}
</style>
</head>
<body>

<div class="page-top">
  <a class="brand-link" href="Index.html">RevCapture</a>
  <div class="top-links">
    <a href="Index.html">Home</a>
  </div>
</div>

<div class="shell">
  <div class="login-box">
    <h2>Login</h2>
    <form id="loginForm">
      <input id="emailInput" type="email" placeholder="Email" autocomplete="username" required>
      <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>
    <div id="loginMessage" class="form-link" style="display:none;"></div>
  </div>
</div>

<script src="/static/auth-client.js"></script>
<script>
  function getDefaultDestination(user) {
    const role = user && user.role ? String(user.role).toLowerCase() : '';

    if (role === 'customer') {
      return 'upload.html';
    }

    if (role === 'operator') {
      return 'upload-history.html';
    }

    return 'Index.html';
  }

  document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const email = document.getElementById('emailInput').value;
    const password = document.getElementById('passwordInput').value;
    const button = event.target.querySelector('button');
    const message = document.getElementById('loginMessage');

    try {
      button.disabled = true;
      button.textContent = 'Signing in...';
      message.style.display = 'none';
      message.textContent = '';
      message.style.color = '#2563eb';

      const result = await window.loginWithPassword(email, password);
      const next = new URLSearchParams(window.location.search).get('next');
      const destination = next || getDefaultDestination(result.user);

      window.location.href = destination;
    } catch (err) {
      message.style.display = 'block';
      message.style.color = '#b42318';
      message.textContent = err && err.message ? err.message : 'Login failed';
      button.disabled = false;
      button.textContent = 'Login';
    }
  });
</script>

</body>
</html>
