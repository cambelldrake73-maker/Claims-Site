<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cases</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #1f2937;
      line-height: 1.4;
    }

    .navbar {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      font-weight: 700;
      color: #111827;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 14px;
    }

    .nav-links a {
      text-decoration: none;
      color: #4b5563;
      font-size: 0.88rem;
      font-weight: 500;
      padding: 2px 0;
    }

    .nav-links a.active {
      color: #111827;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 22px 20px 44px;
    }

    .hero {
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: 1.35rem;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
      color: #111827;
    }

    .hero p {
      color: #6b7280;
      font-size: 0.88rem;
      max-width: 620px;
    }

    .table-shell {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
    }

    th,
    td {
      padding: 14px 16px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: middle;
      font-size: 0.92rem;
    }

    th {
      background: #f9fafb;
      color: #6b7280;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tbody td {
      color: #4b5563;
    }

    tbody tr {
      cursor: pointer;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .claim-id {
      color: #111827;
      font-weight: 600;
    }

    .status-text {
      color: #374151;
      white-space: nowrap;
    }

    .amount {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .empty-state {
      padding: 18px 16px;
      color: #6b7280;
      font-size: 0.92rem;
    }

    @media (max-width: 800px) {
      .navbar {
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Operations Dashboard</div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="claims.html" class="active">Cases</a>
      <a href="review-queue.html">Review Queue</a>
      <a href="reporting.html">Reporting</a>
    </div>
  </nav>

  <main class="page">
    <section class="hero">
      <h1>Cases</h1>
      <p>All processed cases and current status.</p>
    </section>

    <section class="table-shell">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Claim ID</th>
              <th>Patient</th>
              <th>Payer</th>
              <th>Status</th>
              <th>Denial Reason</th>
              <th>Amount</th>
              <th>Date of Service</th>
            </tr>
          </thead>
          <tbody id="claimsTableBody">
            <tr>
              <td class="empty-state" colspan="7">Loading claims...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    function formatAmount(amount) {
      return `$${Number(amount || 0).toLocaleString()}`;
    }

    function formatStatus(status) {
      return String(status || '-')
        .replaceAll('_', ' ')
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    async function loadClaims() {
      try {
        const res = await fetch('/api/claims');
        const data = await res.json();
        const tableBody = document.getElementById('claimsTableBody');

        if (!tableBody) return;

        const claims = data.claims || [];
        tableBody.innerHTML = '';

        if (claims.length === 0) {
          tableBody.innerHTML = '<tr><td class="empty-state" colspan="7">No claims available</td></tr>';
          return;
        }

        claims.forEach(claim => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="claim-id">${claim.claim_id || '-'}</td>
            <td>${claim.patient || '-'}</td>
            <td>${claim.payer || '-'}</td>
            <td class="status-text">${formatStatus(claim.status)}</td>
            <td>${claim.denial_reason || '-'}</td>
            <td class="amount">${formatAmount(claim.amount)}</td>
            <td>${claim.date_of_service || '-'}</td>
          `;
          row.addEventListener('click', () => {
            if (!claim.claim_id) return;
            window.location.href = `claim-detail.html?id=${encodeURIComponent(claim.claim_id)}`;
          });
          tableBody.appendChild(row);
        });
      } catch (err) {
        const tableBody = document.getElementById('claimsTableBody');
        if (tableBody) {
          tableBody.innerHTML = '<tr><td class="empty-state" colspan="7">No claims available</td></tr>';
        }
      }
    }

    loadClaims();
  </script>
</body>
</html>
