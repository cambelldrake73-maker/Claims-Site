<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Uploaded Cases</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --nav: #111827;
      --nav-hover: #1f2937;
      --shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: var(--nav);
      color: white;
      padding: 22px 14px;
      flex-shrink: 0;
    }

    .sidebar h2 {
      margin: 0 0 18px;
      font-size: 18px;
    }

    .sidebar a {
      display: block;
      color: #d1d5db;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 6px;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: var(--nav-hover);
      color: white;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      background: white;
      padding: 18px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .topbar h1 {
      margin: 0;
      font-size: 24px;
    }

    .content {
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .card-head h2 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .card-head p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      background: #fafafa;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #374151;
    }

    tbody tr:hover {
      background: #fcfcfd;
    }

    .case-id {
      font-weight: 700;
      color: #1d4ed8;
      word-break: break-word;
      max-width: 220px;
    }

    .status-pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .under_review {
      background: #ede9fe;
      color: #5b21b6;
    }

    .submitted {
      background: #dcfce7;
      color: #166534;
    }

    .not_recoverable {
      background: #fee2e2;
      color: #991b1b;
    }

    .empty {
      padding: 18px 16px;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }

      .content {
        padding: 18px;
      }

      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Recovery Platform</h2>
      <a href="dashboard.html">Dashboard</a>
      <a href="submit-claims.html">Case Upload</a>
      <a href="claims.html" class="active">Uploaded Cases</a>
      <a href="review-queue.html">Review Queue</a>
      <a href="reports.html">Recovery Insights</a>
      <a href="history.html">History</a>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1>Uploaded Cases</h1>
      </div>

      <div class="content">
        <div class="card">
          <div class="card-head">
            <h2>Case List</h2>
            <p>View uploaded cases and their current recovery status.</p>
          </div>

          <table>
            <thead>
              <tr>
                <th>Case ID</th>
                <th>Patient</th>
                <th>Payer</th>
                <th>Service Date</th>
                <th>Recovery Status</th>
                <th>Amount</th>
                <th>Upload Date</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    function statusLabel(status) {
      const s = String(status || '').toLowerCase();

      if (['denied', 'pending', 'under_review'].includes(s)) return 'Under Review';
      if (['submitted', 'approved'].includes(s)) return 'Submitted';
      if (['not_recoverable', 'rejected'].includes(s)) return 'Not Recoverable';

      return 'Under Review';
    }

    function statusClass(status) {
      const s = String(status || '').toLowerCase();

      if (['denied', 'pending', 'under_review'].includes(s)) return 'under_review';
      if (['submitted', 'approved'].includes(s)) return 'submitted';
      if (['not_recoverable', 'rejected'].includes(s)) return 'not_recoverable';

      return 'under_review';
    }

    function formatDate(timestamp) {
      if (!timestamp) return '-';
      return new Date(timestamp).toLocaleDateString();
    }

    async function loadClaims() {
      try {
        const res = await fetch('/api/claims/all');
        const data = await res.json();

        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';

        const claims = data.claims || [];

        if (claims.length === 0) {
          tableBody.innerHTML = '<tr><td class="empty" colspan="7">No uploaded cases found.</td></tr>';
          return;
        }

        claims.forEach(c => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="case-id">${c.claim_id}</td>
            <td>${c.patient || '-'}</td>
            <td>${c.payer || '-'}</td>
            <td>${c.date_of_service || '-'}</td>
            <td><span class="status-pill ${statusClass(c.status)}">${statusLabel(c.status)}</span></td>
            <td>$${Number(c.amount || 0).toLocaleString()}</td>
            <td>${formatDate(c.created_at)}</td>
          `;
          tableBody.appendChild(row);
        });
      } catch (err) {
        console.error('Failed to load uploaded cases:', err);
      }
    }

    loadClaims();
  </script>
</body>
</html>

<!-- AI improvement: claim search ui wiring -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const filterBar = document.querySelector('.claims-filter-bar');
  if (!filterBar) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Search claims...';
  filterBar.prepend(input);
});
</script>
