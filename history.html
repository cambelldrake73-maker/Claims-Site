<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Batch History</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --nav: #111827;
      --nav-hover: #1f2937;
      --shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: var(--nav);
      color: white;
      padding: 22px 14px;
      flex-shrink: 0;
    }

    .sidebar h2 {
      margin: 0 0 18px;
      font-size: 18px;
    }

    .sidebar a {
      display: block;
      color: #d1d5db;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 6px;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: var(--nav-hover);
      color: white;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      background: white;
      padding: 18px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .topbar h1 {
      margin: 0;
      font-size: 24px;
    }

    .content {
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .card-head h2 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .card-head p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #fafafa;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #374151;
    }

    tbody tr:hover {
      background: #fcfcfd;
    }

    .status-pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .received {
      background: #e0f2fe;
      color: #0c4a6e;
    }

    .processing {
      background: #ede9fe;
      color: #5b21b6;
    }

    .parsed {
      background: #dcfce7;
      color: #166534;
    }

    .failed {
      background: #fee2e2;
      color: #991b1b;
    }

    .files-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
    }

    .empty {
      padding: 18px 16px;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }

      .content {
        padding: 18px;
      }

      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Recovery Platform</h2>
      <a href="dashboard.html">Dashboard</a>
      <a href="submit-claims.html">Case Upload</a>
      <a href="claims.html">Uploaded Cases</a>
      <a href="review-queue.html">Review Queue</a>
      <a href="reports.html">Recovery Insights</a>
      <a href="history.html" class="active">Batch History</a>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1>Batch History</h1>
      </div>

      <div class="content">
        <div class="card">
          <div class="card-head">
            <h2>Uploaded Intake Batches</h2>
            <p>Track upload batches, niches, file counts, and processing status.</p>
          </div>

          <table>
            <thead>
              <tr>
                <th>Batch ID</th>
                <th>Niche</th>
                <th>Files</th>
                <th>Status</th>
                <th>Created</th>
                <th>File Details</th>
              </tr>
            </thead>
            <tbody id="batchTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    function formatDate(timestamp) {
      if (!timestamp) return '-';
      return new Date(timestamp).toLocaleString();
    }

    function statusClass(status) {
      const s = String(status || '').toLowerCase();
      if (['received', 'processing', 'parsed', 'failed'].includes(s)) return s;
      return 'received';
    }

    async function loadBatches() {
      try {
        const res = await fetch('/api/intake/batches');
        const data = await res.json();

        const tableBody = document.getElementById('batchTableBody');
        tableBody.innerHTML = '';

        const batches = data.batches || [];

        if (batches.length === 0) {
          tableBody.innerHTML = '<tr><td class="empty" colspan="6">No intake batches found.</td></tr>';
          return;
        }

        batches.forEach(batch => {
          const files = batch.files || [];
          const fileItems = files.length
            ? `<ul class="files-list">${files.map(file => `<li>${file.file_name} (${file.file_type}, ${file.file_size} bytes)</li>`).join('')}</ul>`
            : '-';

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${batch.batch_id}</td>
            <td>${batch.niche || '-'}</td>
            <td>${batch.file_count ?? 0}</td>
            <td><span class="status-pill ${statusClass(batch.status)}">${batch.status || 'received'}</span></td>
            <td>${formatDate(batch.created_at)}</td>
            <td>${fileItems}</td>
          `;
          tableBody.appendChild(row);
        });
      } catch (err) {
        console.error('Failed to load intake batches:', err);
      }
    }

    loadBatches();
  </script>
</body>
</html>
